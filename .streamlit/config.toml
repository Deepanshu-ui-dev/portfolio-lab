[theme]
base = "light"
primaryColor = "#3157C8"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Navigation is rendered once, consistently, by app.theme.render_sidebar.
showSidebarNavigation = false
